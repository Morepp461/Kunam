# Public directory endpoints perform their own authorization for privileged actions.
[functions.member-directory]
verify_jwt = false

# Registration is authenticated inside the function using auth.getUser().
[functions.complete-paddock-access]
verify_jwt = false

# API-key authenticated integration endpoint (cm_live_ keys).
[functions.caleris-integrations]
verify_jwt = false

# These endpoints require a valid user JWT at the gateway and enforce role/ownership internally.
[functions.admin-user-management]
verify_jwt = true

[functions.economy-engine]
verify_jwt = true

[functions.economy-workflows]
verify_jwt = true

# Uses publishable/secret API keys. The handler validates the user's session with auth.getUser().
# Gateway verify_jwt only supports legacy JWT signing keys, so validation is performed in-function.
[functions.caleris-data-export]
verify_jwt = false

# Discord announcements are authenticated in-function and restricted to FIA/Admin.
[functions.caleris-discord-notify]
verify_jwt = true


# The webhook endpoint validates Midtrans signatures and transaction status in-function.
[functions.midtrans-hq-shop]
verify_jwt = false
