<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="description" content="Caleris Masters — Motorsport Roleplay Platform">
<title>Caleris Masters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08090b;--surface:rgba(9,11,14,.82);--text:#f4f3ef;--muted:#a5a8ad;--gold:#c6a33a;--gold-hi:#f1d77e;--silver:#c9cbd0;--line:rgba(198,163,58,.34);--header:#14202b;--shade:#030405}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif}
body{height:100svh;min-height:500px;overflow:hidden;background:var(--bg);color:var(--text);transition:background .35s,color .35s}
body.light{color-scheme:light;--bg:#e9e8e4;--surface:rgba(242,241,236,.88);--text:#191b1e;--muted:#565c64;--line:rgba(153,119,32,.42);--header:#182633;--shade:#e9e8e4}
.site{height:100svh;min-height:500px;display:grid;grid-template-rows:82px minmax(0,1fr) 58px;position:relative;isolation:isolate;overflow:hidden;background:var(--bg)}
header,footer{z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,76px);background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header{background:color-mix(in srgb,var(--header) 94%,transparent);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;width:176px;height:60px;overflow:hidden;flex:none}
.brand img{display:block;width:176px;height:176px;max-width:none;object-fit:contain;transform:translateY(-56px)}
.header-tools{display:flex;align-items:center;gap:20px}
.platform-label{font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#c3c7cc}
.theme-switch{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:99px;background:#0005}
.theme-switch button{width:34px;height:32px;border:0;border-radius:50%;background:transparent;color:#b9bdc3;font-size:17px;cursor:pointer}
.theme-switch button[aria-pressed=true]{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#17130a}
.scene{position:absolute;inset:82px 0 58px;z-index:-2;overflow:hidden;background:radial-gradient(ellipse at 70% 48%,#3a3530 0%,#151619 43%,#07080a 82%)}
body.light .scene{background:radial-gradient(ellipse at 70% 48%,#c8c5bc 0%,#a8a8a3 42%,#e9e8e4 85%)}
.track-art{position:absolute;inset:0;width:100%;height:100%;opacity:.55;animation:trackDrift 28s ease-in-out infinite alternate}
.track-art path{fill:none;stroke:#aeb4ba;stroke-opacity:.24;stroke-width:2.2;vector-effect:non-scaling-stroke}
.track-art .kerb{stroke:var(--gold);stroke-opacity:.44;stroke-width:5;stroke-dasharray:30 18;animation:kerbFlow 18s linear infinite}
.track-art .thin{stroke-width:1;stroke-opacity:.18}
body.light .track-art path{stroke:#303b45;stroke-opacity:.25}
body.light .track-art .kerb{stroke:#9b7925;stroke-opacity:.5}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--shade) 0%,color-mix(in srgb,var(--shade) 70%,transparent) 18%,transparent 52%,color-mix(in srgb,var(--shade) 25%,transparent) 78%,var(--shade) 100%),linear-gradient(0deg,var(--shade) 0%,transparent 26%,color-mix(in srgb,var(--shade) 45%,transparent) 100%),radial-gradient(ellipse at center,transparent 35%,var(--shade) 100%);z-index:2;pointer-events:none}
.scene:after{content:"";position:absolute;inset:auto -10% -20%;height:42%;background:linear-gradient(90deg,transparent,#a77f2d33,#9c302b44,transparent);filter:blur(70px);transform:rotate(-5deg);animation:trackLight 13s ease-in-out infinite alternate}
main{position:relative;display:grid;grid-template-columns:minmax(310px,.8fr) minmax(0,1.4fr);align-items:center;min-height:0;padding:0 clamp(18px,5vw,76px)}
.copy{position:relative;z-index:3;max-width:570px;padding:26px 0 34px;animation:copyIn .9s ease both}
.kicker{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:var(--gold-hi);font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.32em;text-transform:uppercase}
.kicker:before{content:"";width:34px;height:1px;background:var(--gold)}
h1{margin:0;color:var(--text);font:400 clamp(28px,3.2vw,46px)/1.18 Audiowide,sans-serif;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 6px 28px #0008}
h1 span{display:block;color:var(--silver);font-size:.55em;letter-spacing:.17em;margin-top:10px}
body.light h1{text-shadow:0 5px 22px #fff8}
body.light h1 span{color:#50545b}
body.light .kicker{color:#80620e}
body.light .kicker:before{background:#9b7925}
.description{max-width:390px;margin:19px 0 0;color:var(--muted);font-size:clamp(11px,1vw,13px);line-height:1.85;letter-spacing:.035em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.action{min-height:50px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid #d2d4d7a6;border-radius:4px;background:rgba(9,12,15,.8);color:#f5f3ed;text-decoration:none;text-transform:uppercase;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;white-space:nowrap;backdrop-filter:blur(10px);transition:transform .22s,border-color .22s,background .22s,box-shadow .22s}
.action svg{width:17px;height:17px;flex:none}
.action:hover{transform:translateY(-3px);border-color:var(--gold-hi);box-shadow:0 12px 26px #0005}
.action.primary{color:#17130a;border-color:#e1c05b;background:linear-gradient(135deg,#f0d77f,#b48a25);box-shadow:0 8px 24px #0005}
.action.primary:hover{background:linear-gradient(135deg,#ffe9a0,#c39a36)}
body.light .action:not(.primary){background:#17232e;color:#fff;border-color:#263847}
.car-stage{position:absolute;inset:0 0 0 27%;z-index:1;pointer-events:none;overflow:hidden}
.hero-canvas{display:block;width:100%;height:100%;outline:none}
footer{border-top:1px solid var(--line);gap:18px;justify-content:flex-end}
.footer-note{font:600 10px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:right}
@keyframes trackLight{from{opacity:.35;transform:rotate(-5deg) translateX(-3%)}to{opacity:.8;transform:rotate(-2deg) translateX(3%)}}
@keyframes trackDrift{from{transform:translate3d(-1.5%,.5%,0) scale(1)}to{transform:translate3d(1.5%,-.5%,0) scale(1.035)}}
@keyframes kerbFlow{to{stroke-dashoffset:-420}}
@keyframes copyIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.site{grid-template-rows:72px minmax(0,1fr) 54px}.scene{inset:72px 0 54px}header{padding:0 22px}.brand{width:158px;height:56px}.brand img{width:158px;height:158px;transform:translateY(-50px)}.platform-label{display:none}main{grid-template-columns:1fr;padding:0 24px}.copy{align-self:end;padding:0 0 clamp(34px,8vh,70px);max-width:540px}.car-stage{inset:0 0 24% 0}h1{font-size:clamp(29px,5vw,42px)}.description{max-width:360px}.actions{max-width:510px}.action{min-height:48px}}
@media(max-width:560px){.site{grid-template-rows:64px minmax(0,1fr) 48px;min-height:480px}.scene{inset:64px 0 48px}header{padding:0 16px}.brand{width:150px;height:54px}.brand img{width:150px;height:150px;transform:translateY(-48px)}.header-tools{gap:0}.theme-switch button{width:31px;height:29px;font-size:15px}main{padding:0 18px}.car-stage{inset:0 0 29% 0}.copy{padding-bottom:clamp(22px,5vh,42px)}.kicker{font-size:10px;margin-bottom:12px;letter-spacing:.24em}h1{font-size:clamp(24px,7vw,34px)}h1 span{font-size:.5em;margin-top:7px}.description{font-size:10px;line-height:1.65;margin-top:12px;max-width:300px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.action{min-height:45px;padding:0 9px;font-size:11px;gap:7px}.action.primary{grid-column:1/-1;grid-row:1}.action svg{width:15px;height:15px}footer{padding:0 16px}.footer-note{font-size:8px;letter-spacing:.12em}}
@media(max-height:620px) and (min-width:561px){.site{grid-template-rows:62px minmax(0,1fr) 44px}.scene{inset:62px 0 44px}.copy{padding:8px 0}.actions{margin-top:18px}.action{min-height:42px}}
@media(max-height:560px){.site{min-height:0;grid-template-rows:56px minmax(0,1fr) 40px}.scene{inset:56px 0 40px}header{padding:0 18px}.brand{height:48px}main{padding:0 24px}.copy{padding:8px 0}.kicker{margin-bottom:8px}.description{margin-top:8px;line-height:1.5}.actions{margin-top:14px}.action{min-height:38px}.car-stage{inset:0 0 0 24%}footer{padding:0 18px}}
@media(max-height:560px) and (max-width:560px){.site{grid-template-rows:54px minmax(0,1fr) 36px}.scene{inset:54px 0 36px}header{padding:0 12px}.brand{width:138px;height:46px}.brand img{width:138px;height:138px;transform:translateY(-45px)}main{padding:0 14px}.car-stage{inset:0 0 28% 0}.copy{padding-bottom:10px}.description{max-width:270px}.actions{margin-top:12px}.action{min-height:36px;font-size:10px}footer{padding:0 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="site">
<header>
<a class="brand" href="/" aria-label="Beranda Caleris Masters"><img src="/assets/Add%20a%20heading_20260907_003952_0000.png" alt="Logo Caleris Masters"></a>
<div class="header-tools"><span class="platform-label">Motorsport Roleplay Platform</span><div class="theme-switch" role="group" aria-label="Pilih tema"><button id="lightMode" type="button" aria-label="Mode terang" aria-pressed="false">☼</button><button id="darkMode" type="button" aria-label="Mode gelap" aria-pressed="true">☾</button></div></div>
</header>
<div class="scene" aria-hidden="true">
<svg class="track-art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<path d="M-90 690 C180 660 185 360 430 330 S690 570 870 470 980 150 1220 160 1440 340 1700 220"/>
<path class="kerb" d="M-90 715 C180 685 185 385 430 355 S690 595 870 495 980 175 1220 185 1440 365 1700 245"/>
<path d="M-90 760 C150 735 230 430 430 405 S670 650 900 540 1020 225 1215 225 1450 410 1700 300"/>
<path class="thin" d="M-90 560 C180 535 135 275 430 260 S720 490 850 405 960 90 1240 105 1470 270 1700 160"/>
<path class="thin" d="M0 830 C250 800 310 570 500 550 S720 740 950 650 1100 330 1280 330 1500 510 1700 420"/>
</svg>
</div>
<main>
<div class="copy">
<p class="kicker">The race begins here</p>
<h1>Build your legacy<span>On and off the track</span></h1>
<p class="description">A world where every decision shapes your career. Join the grid, develop your team, and write your own motorsport story.</p>
<nav class="actions" aria-label="Aksi utama">
<a class="action" href="/rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v18H7.5A3.5 3.5 0 0 0 4 23z"/><path d="M4 5.5v17A3.5 3.5 0 0 1 7.5 19H20"/></svg>Rules</a>
<a class="action primary" href="/auth/discord"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.7 5.2a18 18 0 0 0-4.4-1.4l-.5 1a16.6 16.6 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.4C1.5 9.3.7 13.3 1.1 17.2a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a12.8 12.8 0 0 0 11.4 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.5-.8-8.4-3.2-12zM8.5 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>Login with Discord</a>
<a class="action" href="https://discord.com/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0Z"/><path d="M8 10h.01M16 10h.01M8 15c2.4 2 5.6 2 8 0"/></svg>Join Our Community</a>
</nav>
</div>
<div class="car-stage" aria-label="Mobil balap Caleris Masters dan dua pembalap 3D"></div>
</main>
<footer><div class="footer-note">A Motorsport Roleplay Experience</div></footer>
</div>
<script>
const light=document.getElementById('lightMode'),dark=document.getElementById('darkMode');
function setTheme(theme){document.body.classList.toggle('light',theme==='light');light.setAttribute('aria-pressed',String(theme==='light'));dark.setAttribute('aria-pressed',String(theme==='dark'));try{localStorage.setItem('caleris-theme',theme)}catch{}}
let saved='dark';try{saved=localStorage.getItem('caleris-theme')||'dark'}catch{}setTheme(saved);
light.addEventListener('click',()=>setTheme('light'));dark.addEventListener('click',()=>setTheme('dark'));
</script>
<script type="module" src="/hero-scene.js"></script>
</body>
</html>
