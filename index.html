<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="description" content="Caleris Masters — Motorsport Roleplay Platform">
<title>Caleris Masters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08090b;--surface:rgba(9,11,14,.78);--text:#f4f3ef;--muted:#c3c3c1;--gold:#c6a33a;--gold-hi:#f1d77e;--line:rgba(198,163,58,.34);--header:rgba(10,15,20,.82)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif}
body{height:100svh;min-height:500px;overflow:hidden;background:var(--bg);color:var(--text);transition:color .3s}
body.light{color-scheme:light;--text:#fff;--muted:#e0ded8;--line:rgba(198,163,58,.5);--header:rgba(18,24,29,.78)}
.site{height:100svh;min-height:500px;display:grid;grid-template-rows:76px minmax(0,1fr) 48px;position:relative;isolation:isolate;overflow:hidden;background:var(--bg)}
header,footer{z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,76px);background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header{background:var(--header);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;width:176px;height:60px;overflow:hidden;flex:none}
.brand img{display:block;width:176px;height:176px;max-width:none;object-fit:contain;transform:translateY(-56px)}
.header-tools{display:flex;align-items:center;gap:20px}
.platform-label{font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#c3c7cc}
.theme-switch{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:99px;background:#0007}
.theme-switch button{width:34px;height:32px;border:0;border-radius:50%;background:transparent;color:#b9bdc3;font-size:17px;cursor:pointer}
.theme-switch button[aria-pressed=true]{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#17130a}
.scene{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#08090b}
.scene:before{content:"";position:absolute;inset:-3%;background:url("/assets/Background.png") center 48%/cover no-repeat;filter:blur(24px) brightness(.42) saturate(.8);transform:scale(1.06)}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,7,.78) 0%,rgba(3,5,7,.38) 34%,rgba(3,5,7,.04) 68%,rgba(3,5,7,.2) 100%),linear-gradient(0deg,rgba(3,5,7,.55),transparent 34%,rgba(3,5,7,.14));pointer-events:none}
.scene-image,.smoke-photo-motion{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center}
.scene-image{z-index:1}
.smoke-photo-motion{z-index:2;opacity:.78;pointer-events:none;mix-blend-mode:screen;filter:url(#smokeWarp) brightness(1.18) saturate(1.12);mask-image:radial-gradient(ellipse 37% 15% at 68% 72%,#fff 0%,rgba(255,255,255,.92) 42%,transparent 100%),radial-gradient(ellipse 29% 18% at 25% 67%,#fff 0%,rgba(255,255,255,.82) 48%,transparent 100%),radial-gradient(ellipse 44% 13% at 53% 86%,#fff 0%,rgba(255,255,255,.75) 48%,transparent 100%),radial-gradient(ellipse 25% 13% at 88% 57%,#fff 0%,rgba(255,255,255,.7) 44%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 37% 15% at 68% 72%,#fff 0%,rgba(255,255,255,.92) 42%,transparent 100%),radial-gradient(ellipse 29% 18% at 25% 67%,#fff 0%,rgba(255,255,255,.82) 48%,transparent 100%),radial-gradient(ellipse 44% 13% at 53% 86%,#fff 0%,rgba(255,255,255,.75) 48%,transparent 100%),radial-gradient(ellipse 25% 13% at 88% 57%,#fff 0%,rgba(255,255,255,.7) 44%,transparent 100%)}
.smoke-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
main{position:relative;z-index:3;display:grid;grid-template-columns:minmax(300px,.82fr) minmax(0,1.18fr);align-items:center;min-height:0;padding:0 clamp(18px,5vw,76px)}
.copy{position:relative;z-index:3;max-width:520px;padding:26px 0 34px;animation:none}
.kicker{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:var(--gold-hi);font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.32em;text-transform:uppercase}
.kicker:before{content:"";width:34px;height:1px;background:var(--gold)}
h1{margin:0;color:var(--text);font:400 clamp(28px,3.2vw,46px)/1.18 Audiowide,sans-serif;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 6px 28px #000b}
h1 span{display:block;color:#dedbd2;font-size:.55em;letter-spacing:.17em;margin-top:10px}
.description{max-width:390px;margin:19px 0 0;color:var(--muted);font-size:clamp(11px,1vw,13px);line-height:1.85;letter-spacing:.035em;text-shadow:0 2px 12px #000}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.action{min-height:50px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid #d2d4d7a6;border-radius:4px;background:rgba(9,12,15,.82);color:#f5f3ed;text-decoration:none;text-transform:uppercase;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;white-space:nowrap;backdrop-filter:blur(10px);transition:transform .22s,border-color .22s,background .22s,box-shadow .22s}
.action svg{width:17px;height:17px;flex:none}
.action:hover{transform:translateY(-3px);border-color:var(--gold-hi);box-shadow:0 12px 26px #0005}
.action.primary{color:#17130a;border-color:#e1c05b;background:linear-gradient(135deg,#f0d77f,#b48a25);box-shadow:0 8px 24px #0005}
.action.primary:hover{background:linear-gradient(135deg,#ffe9a0,#c39a36)}
footer{border-top:1px solid var(--line);gap:18px;justify-content:flex-end;background:rgba(5,7,9,.58)}
.footer-note{font:600 10px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#d0cbc0;text-align:right}
@keyframes copyIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.site{grid-template-rows:68px minmax(0,1fr) 46px}header{padding:0 22px}.brand{width:158px;height:56px}.brand img{width:158px;height:158px;transform:translateY(-50px)}.platform-label{display:none}main{grid-template-columns:1fr;padding:0 24px}.copy{max-width:480px}.scene-image,.smoke-photo-motion{object-fit:cover;object-position:center 46%}.scene:after{background:linear-gradient(90deg,rgba(3,5,7,.5),transparent 80%),linear-gradient(0deg,rgba(3,5,7,.72),transparent 48%,rgba(3,5,7,.12))}}
@media(max-width:560px){.site{grid-template-rows:62px minmax(0,1fr) 42px;min-height:480px}header{padding:0 16px}.brand{width:150px;height:54px}.brand img{width:150px;height:150px;transform:translateY(-48px)}.header-tools{gap:0}.theme-switch button{width:31px;height:29px;font-size:15px}main{align-items:end;padding:0 17px}.copy{max-width:none;padding:0 0 24px}.kicker{font-size:10px;margin-bottom:10px;letter-spacing:.24em}h1{font-size:clamp(23px,6.8vw,32px)}h1 span{font-size:.5em;margin-top:7px}.description{font-size:10px;line-height:1.6;margin-top:10px;max-width:330px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.action{min-height:43px;padding:0 8px;font-size:10px;gap:7px}.action.primary{grid-column:1/-1;grid-row:1}.action svg{width:15px;height:15px}footer{padding:0 16px}.footer-note{font-size:8px;letter-spacing:.12em}.scene-image,.smoke-photo-motion{object-position:center center}.smoke-photo-motion{opacity:.88;mask-image:radial-gradient(ellipse 42% 14% at 68% 71%,#fff 0%,rgba(255,255,255,.9) 45%,transparent 100%),radial-gradient(ellipse 30% 17% at 24% 65%,#fff 0%,rgba(255,255,255,.8) 48%,transparent 100%),radial-gradient(ellipse 46% 12% at 52% 86%,#fff 0%,rgba(255,255,255,.72) 48%,transparent 100%),radial-gradient(ellipse 26% 12% at 89% 57%,#fff 0%,rgba(255,255,255,.7) 44%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 42% 14% at 68% 71%,#fff 0%,rgba(255,255,255,.9) 45%,transparent 100%),radial-gradient(ellipse 30% 17% at 24% 65%,#fff 0%,rgba(255,255,255,.8) 48%,transparent 100%),radial-gradient(ellipse 46% 12% at 52% 86%,#fff 0%,rgba(255,255,255,.72) 48%,transparent 100%),radial-gradient(ellipse 26% 12% at 89% 57%,#fff 0%,rgba(255,255,255,.7) 44%,transparent 100%)}.scene:after{background:linear-gradient(0deg,rgba(3,5,7,.88) 0%,rgba(3,5,7,.5) 32%,transparent 72%,rgba(3,5,7,.15) 100%)}}
@media(max-height:620px) and (min-width:561px){.site{grid-template-rows:58px minmax(0,1fr) 38px}.copy{padding:8px 0}.actions{margin-top:16px}.action{min-height:40px}}
@media(max-height:560px) and (max-width:560px){.site{grid-template-rows:52px minmax(0,1fr) 34px}.brand{height:44px}.brand img{width:138px;height:138px;transform:translateY(-45px)}.copy{padding-bottom:9px}.kicker{margin-bottom:6px}.description{margin-top:6px}.actions{margin-top:9px}.action{min-height:34px}footer{padding:0 12px}}
@media(prefers-reduced-motion:reduce){.copy{animation:none}*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="site">
<header>
<a class="brand" href="/" aria-label="Beranda Caleris Masters"><img src="/assets/Add%20a%20heading_20260907_003952_0000.png" alt="Logo Caleris Masters"></a>
<div class="header-tools"><span class="platform-label">Motorsport Roleplay Platform</span><div class="theme-switch" role="group" aria-label="Pilih tema"><button id="lightMode" type="button" aria-label="Mode terang" aria-pressed="false">☼</button><button id="darkMode" type="button" aria-label="Mode gelap" aria-pressed="true">☾</button></div></div>
</header>
<div class="scene" aria-hidden="true">
<img class="scene-image" src="/assets/Background.png" alt="" fetchpriority="high">
<img class="smoke-photo-motion" src="/assets/Background.png" alt="" aria-hidden="true">
<svg class="smoke-filter-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
<filter id="smokeWarp" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" numOctaves="2" seed="11" baseFrequency="0.010 0.024" result="smokeNoise">
<animate attributeName="baseFrequency" values="0.008 0.021;0.014 0.038;0.010 0.026;0.008 0.021" dur="19s" repeatCount="indefinite"/>
<animate attributeName="seed" values="11;17;23;11" dur="31s" repeatCount="indefinite"/>
</feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="smokeNoise" scale="34" xChannelSelector="R" yChannelSelector="G">
<animate attributeName="scale" values="22;48;31;42;22" dur="13s" repeatCount="indefinite"/>
</feDisplacementMap>
</filter>
</svg>
<canvas class="smoke-canvas"></canvas>
</div>
<main>
<div class="copy">
<p class="kicker">The race begins here</p>
<h1>Build your legacy<span>On and off the track</span></h1>
<p class="description">A world where every decision shapes your career. Join the grid, develop your team, and write your own motorsport story.</p>
<nav class="actions" aria-label="Aksi utama">
<a class="action" href="/rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v18H7.5A3.5 3.5 0 0 0 4 23z"/><path d="M4 5.5v17A3.5 3.5 0 0 1 7.5 19H20"/></svg>Rules</a>
<a class="action primary" href="/auth/discord"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.7 5.2a18 18 0 0 0-4.4-1.4l-.5 1a16.6 16.6 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.4C1.5 9.3.7 13.3 1.1 17.2a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a12.8 12.8 0 0 0 11.4 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.5-.8-8.4-3.2-12zM8.5 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>Login with Discord</a>
<a class="action" href="https://discord.com/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0Z"/><path d="M8 10h.01M16 10h.01M8 15c2.4 2 5.6 2 8 0"/></svg>Join Our Community</a>
</nav>
</div>
</main>
<footer><div class="footer-note">A Motorsport Roleplay Experience</div></footer>
</div>
<script>
const light=document.getElementById('lightMode'),dark=document.getElementById('darkMode');
function setTheme(theme){document.body.classList.toggle('light',theme==='light');light.setAttribute('aria-pressed',String(theme==='light'));dark.setAttribute('aria-pressed',String(theme==='dark'));try{localStorage.setItem('caleris-theme',theme)}catch{}}
let saved='dark';try{saved=localStorage.getItem('caleris-theme')||'dark'}catch{}setTheme(saved);
light.addEventListener('click',()=>setTheme('light'));dark.addEventListener('click',()=>setTheme('dark'));
</script>
<script src="/smoke-motion.js" defer></script>
</body>
</html>
