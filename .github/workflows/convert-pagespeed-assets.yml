name: One-time PageSpeed WebP asset conversion
on:
  push:
    branches:
      - perf/pagespeed-webp-assets
permissions:
  contents: write
jobs:
  convert:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pagespeed-webp-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert verified source assets and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          jobs = [
              (Path("assets/Background 3.png"), Path("assets/Background 3.webp"), 86),
              (Path("assets/Untitled design_20261103_142659_0000.png"), Path("assets/VREEO.ID.webp"), 90),
          ]
          for source, target, quality in jobs:
              if not source.is_file():
                  raise SystemExit(f"Missing source asset: {source}")
              with Image.open(source) as image:
                  image.load()
                  image.save(target, "WEBP", quality=quality, method=6)
              if not target.is_file() or target.stat().st_size == 0:
                  raise SystemExit(f"WebP output missing or empty: {target}")
              if target.stat().st_size >= source.stat().st_size:
                  raise SystemExit(f"WebP did not reduce size: {source} -> {target}")
              print(f"{source}: {source.stat().st_size} -> {target}: {target.stat().st_size} bytes")

          replacements = {
              "index.html": [("/assets/Background%203.png", "/assets/Background%203.webp")],
              "src/styles.css": [("/assets/Background%203.png", "/assets/Background%203.webp")],
              "src/MainLayout.tsx": [
                  ("/assets/Background%203.png", "/assets/Background%203.webp"),
                  ("/assets/Untitled%20design_20261103_142659_0000.png", "/assets/VREEO.ID.webp"),
              ],
              "src/AboutUs.tsx": [
                  ("/assets/Untitled%20design_20261103_142659_0000.png", "/assets/VREEO.ID.webp"),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected asset reference not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)

          for source, _, _ in jobs:
              source.unlink()
          PY
      - name: Commit optimized assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: convert heavy landing assets to WebP [skip ci]"
          git push origin perf/pagespeed-webp-assets
      - name: Remove one-time conversion workflow
        run: |
          git rm .github/workflows/convert-pagespeed-assets.yml
          git commit -m "chore: remove one-time asset conversion workflow [skip ci]"
          git push origin perf/pagespeed-webp-assets
