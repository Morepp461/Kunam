name: Generate Supabase migration files
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/generate-migration-cli.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.ref }}
          repository: \${{ github.repository }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migrations with Supabase CLI
        run: |
          supabase migration new caleris_assets_marketplace
          sleep 1
          supabase migration new achievement_expansion_digital_id_templates
          sleep 1
          supabase migration new midtrans_hq_shop_foundation
      - name: Commit generated migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate feature migrations with Supabase CLI"
          git push origin HEAD:\${{ github.event.pull_request.head.ref }}
