name: Generate migration through Supabase CLI
on:
  push:
    branches:
      - feat/assets-achievements-digital-id-20261127-v2
    paths:
      - .github/workflows/generate-migration-cli.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assets-achievements-digital-id-20261127-v2
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration filename
        run: supabase migration new assets_marketplace_core
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate assets migration with Supabase CLI"
          git push origin HEAD:feat/assets-achievements-digital-id-20261127-v2
