name: Caleris CI
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run check
      - run: npm run build
      - run: python3 -B scripts/validate.py
      - name: Economy transaction regression checks
        run: python3 -B scripts/test_economy_regressions.py
      - name: Economy wallet lifecycle checks
        run: python3 -B scripts/test_economy_wallet_lifecycle.py
      - name: Economy automation regression checks
        run: python3 -B scripts/test_economy_automation.py
      - name: Wealth Tax engine regression checks
        run: python3 -B scripts/test_wealth_tax_engine.py
      - name: Team Take Over settlement regression checks
        run: python3 -B scripts/test_team_takeover_settlement.py
      - name: Driver Loan full-season payroll regression checks
        run: python3 -B scripts/test_driver_loan_engine.py
      - name: Main Event registration regression checks
        run: python3 -B scripts/test_main_event_registration.py
      - name: Development cash economy regression checks
        run: python3 -B scripts/test_development_cash_economy.py
      - name: Developer API and MCP security regression checks
        run: python3 -B scripts/test_developer_api_security.py
      - name: Registration image optimization regression checks
        run: python3 -B scripts/test_image_optimization.py
      - name: Race lifecycle and payroll automation regression checks
        run: python3 -B scripts/test_race_payroll_automation.py
      - name: Cross-engine integration regression checks
        run: python3 -B scripts/test_engine_integrations.py
      - name: Edge Function JWT and profile privacy checks
        run: python3 -B scripts/test_edge_function_auth_boundaries.py
      - name: Supabase schema parity guard
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_TESTING_DB_URL: ${{ secrets.SUPABASE_TESTING_DB_URL }}
        run: python3 -B scripts/check_migration_parity.py
