name: Pemeriksaan Landing Page

on:
  push:
    branches:
      - main
      - feat/caleris-landing-page
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pemeriksaan:
    name: Validasi struktur halaman
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Periksa struktur landing page
        run: python3 scripts/validate.py
