name: Pemeriksaan Landing Page

on:
  push:
    branches:
      - main
      - fix/hero-3d-rendering-and-qa
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: landing-page-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pemeriksaan:
    name: Validasi landing page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Periksa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Periksa sintaks JavaScript animasi asap
        run: node --check smoke-motion.js

      - name: Periksa versi Python
        run: python3 --version

      - name: Jalankan pemeriksaan landing page
        run: python3 -B scripts/validate.py
