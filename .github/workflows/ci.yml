name: Caleris CI
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Report resolved Picomatch dependency paths
        run: npm ls picomatch --all || true
      - name: Full dependency security audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Verify Deno worker source parity
        run: npm run sync:race-engine-edge && git diff --exit-code -- supabase/functions/race-engine-test-service/race-engine
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check browser-facing Caleris Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/caleris-data-export/index.ts supabase/functions/caleris-integrations/index.ts
      - name: Type-check Race Engine Edge Function and persistent worker
        run: deno check supabase/functions/race-engine-test-service/index.ts workers/race-engine-worker/main.ts
      - run: npm run check
      - run: npm run build
      - name: Unit and schema validation tests
        run: npm run test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - run: python3 -B scripts/validate.py
      - name: PageSpeed optimized asset regression checks
        run: python3 -B scripts/test_pagespeed_webp_assets.py
      - name: Paddock Access CORS regression checks
        run: python3 -B scripts/test_paddock_access_cors.py
      - name: Pre-launch CORS, privacy consent, and legal sitemap checks
        run: python3 -B scripts/test_prelaunch_six_blockers.py
      - name: Mobile lifecycle and consent regression checks
        run: python3 -B scripts/test_mobile_lifecycle_and_consent.py
      - name: CALERIS dropdown and navigation UI regression checks
        run: python3 -B scripts/test_caleris_controls_ui.py
      - name: Cale mascot and wardrobe regression checks
        run: python3 -B scripts/test_cale_mascot.py
      - name: Live driver and team profile directory checks
        run: python3 -B scripts/test_profile_directory_links.py
      - name: Admin Workflow operations hub checks
        run: python3 -B scripts/test_admin_workflow_hub.py
      - name: Economy transaction regression checks
        run: python3 -B scripts/test_economy_regressions.py
      - name: Economy wallet lifecycle checks
        run: python3 -B scripts/test_economy_wallet_lifecycle.py
      - name: Economy automation regression checks
        run: python3 -B scripts/test_economy_automation.py
      - name: Wealth Tax engine regression checks
        run: python3 -B scripts/test_wealth_tax_engine.py
      - name: Team Take Over settlement regression checks
        run: python3 -B scripts/test_team_takeover_settlement.py
      - name: Driver Loan full-season payroll regression checks
        run: python3 -B scripts/test_driver_loan_engine.py
      - name: Main Event registration regression checks
        run: python3 -B scripts/test_main_event_registration.py
      - name: Development cash economy regression checks
        run: python3 -B scripts/test_development_cash_economy.py
      - name: Developer API and MCP security regression checks
        run: python3 -B scripts/test_developer_api_security.py
      - name: Registration image optimization regression checks
        run: python3 -B scripts/test_image_optimization.py
      - name: Race lifecycle and payroll automation regression checks
        run: python3 -B scripts/test_race_payroll_automation.py
      - name: Cross-engine integration regression checks
        run: python3 -B scripts/test_engine_integrations.py
      - name: Edge Function JWT and profile privacy checks
        run: python3 -B scripts/test_edge_function_auth_boundaries.py
      - name: Driver contract request workflow checks
        run: python3 -B scripts/test_driver_contract_requests.py
      - name: Admin Manage User security checks
        run: python3 -B scripts/test_admin_manage_user.py
      - name: Team inactivity freeze and compensation checks
        run: python3 -B scripts/test_team_inactivity_freeze.py
      - name: Member Directory rate-limit regression checks
        run: python3 -B scripts/test_member_directory_rate_limits.py
      - name: Supabase schema parity guard
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_TESTING_DB_URL: ${{ secrets.SUPABASE_TESTING_DB_URL }}
        run: python3 -B scripts/check_migration_parity.py
