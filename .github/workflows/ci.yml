name: Pemeriksaan Landing Page

on:
  push:
    branches:
      - main
      - feat/caleris-landing-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: landing-page-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pemeriksaan:
    name: Validasi landing page
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Periksa versi Python
        run: python --version

      - name: Jalankan pemeriksaan landing page
        run: python -B scripts/validate.py
