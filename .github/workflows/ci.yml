name: Caleris CI
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: python3 -B scripts/validate.py
