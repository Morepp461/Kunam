name: Caleris CI
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run check
      - run: npm run build
      - run: python3 -B scripts/validate.py
      - name: Economy transaction regression checks
        run: python3 -B scripts/test_economy_regressions.py
      - name: Economy wallet lifecycle checks
        run: python3 -B scripts/test_economy_wallet_lifecycle.py
      - name: Wealth Tax engine regression checks
        run: python3 -B scripts/test_wealth_tax_engine.py
      - name: Team Take Over settlement regression checks
        run: python3 -B scripts/test_team_takeover_settlement.py
