name: Landing page QA

on:
  push:
    branches: [main, feat/caleris-landing-page]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate landing page structure
        run: python scripts/validate.py
